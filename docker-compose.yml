# Sobe o site com Nginx: docker compose up -d (porta 80). Publica só a pasta site/.
services:
  web:
    image: nginx:alpine
    container_name: raras-por-natureza
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
